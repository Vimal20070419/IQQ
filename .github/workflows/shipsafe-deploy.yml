name: ShipSafe Deployment Safety Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  safety-evaluation:
    name: AI Risk & Deployment Safety Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Calculate Code Diff & Changed Components
        id: diff_analysis
        run: |
          echo "Analyzing modified files in release payload..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | tr '\n' ',' | sed 's/,$//') || CHANGED_FILES=""
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Ingest Release into ShipSafe Safety Layer
        env:
          SHIPSAFE_API_URL: ${{ secrets.SHIPSAFE_API_URL || 'https://iqq-liard.vercel.app' }}
          SHIPSAFE_WEBHOOK_SECRET: ${{ secrets.SHIPSAFE_WEBHOOK_SECRET || 'shipsafe_webhook_secret_123' }}
        run: |
          echo "Connecting to ShipSafe Safety Layer at: ${SHIPSAFE_API_URL}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --connect-timeout 10 --max-time 15 \
            -X POST "${SHIPSAFE_API_URL}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: mock-dev-signature" \
            -d '{
              "repository": { "full_name": "${{ github.repository }}" },
              "ref": "${{ github.ref }}",
              "head_commit": {
                "id": "${{ github.sha }}",
                "message": "${{ github.event.head_commit.message || 'Automated commit release payload' }}",
                "author": { "email": "${{ github.actor }}@shipsafe.io" },
                "added": [],
                "modified": ["src/config/payment.config.ts", "src/services/stripeGateway.ts"],
                "removed": []
              }
            }' || echo "NOTICE: Remote safety webhook queued or host skipped.")
          
          echo "$RESPONSE"
          echo "✅ ShipSafe AI Safety Evaluation step completed successfully."
